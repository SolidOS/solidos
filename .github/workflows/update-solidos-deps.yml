name: Update SolidOS Dev Dependencies

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version to use
        type: number
        required: false
        default: 22
    secrets:
      GIT_PUSH_TOKEN:
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_skip: ${{ steps.skip-check.outputs.should_skip }}
    steps:
      - name: Check if fork PR
        id: skip-check
        run: |
          IS_FORK=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "Detected fork PR: will install deps but skip commit"
            IS_FORK=true
          fi
          echo "should_skip=$IS_FORK" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: steps.skip-check.outputs.should_skip != 'true'
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GIT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v6
        if: steps.skip-check.outputs.should_skip == 'true'
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: https://registry.npmjs.org
      # npm 10's arborist crashes with "Cannot read properties of null
      # (reading 'edgesOut')" when doing a fresh `npm install` (no lockfile) on
      # trees with optional peer deps (e.g. vitest). Fixed in npm 11.
      - name: Use npm 11 (arborist fix for fresh-install crash)
        run: npm install -g npm@11
      - run: npm ci
      - name: Install solidos dependencies (dev if newer, else latest)
        shell: bash
        run: |
          pkgs=$(node -p "(require('./package.json').solidosDependencies || []).join(' ')")
          if [ -z "$pkgs" ]; then
            echo "No solidosDependencies found, skipping"
            exit 0
          fi
          # Semver precedence for X.Y.Z[-pre]: a release is newer than a prerelease of
          # the same version, so `sort -V` cannot be used here (it ranks 6.0.0-2 above
          # 6.0.0 and would pin the older prerelease).
          is_newer() { # $1 candidate, $2 reference; true when candidate > reference
            CAND="$1" REF="$2" node -e '
              const cmp = (a, b) => {
                const [ ac = "", ap = "" ] = a.split("-", 2);
                const [ bc = "", bp = "" ] = b.split("-", 2);
                const an = ac.split(".").map(Number);
                const bn = bc.split(".").map(Number);
                for (let i = 0; i < Math.max(an.length, bn.length); i += 1) {
                  const d = (an[i] || 0) - (bn[i] || 0);
                  if (d !== 0) return Math.sign(d);
                }
                if (ap === bp) return 0;
                if (!ap) return 1;
                if (!bp) return -1;
                const as = ap.split(".");
                const bs = bp.split(".");
                for (let i = 0; i < Math.max(as.length, bs.length); i += 1) {
                  if (as[i] === undefined) return -1;
                  if (bs[i] === undefined) return 1;
                  const ax = /^\d+$/u.test(as[i]);
                  const bx = /^\d+$/u.test(bs[i]);
                  if (ax && bx) {
                    const d = Number(as[i]) - Number(bs[i]);
                    if (d !== 0) return Math.sign(d);
                  } else if (ax !== bx) return ax ? -1 : 1;
                  else if (as[i] !== bs[i]) return as[i] > bs[i] ? 1 : -1;
                }
                return 0;
              };
              process.exit(cmp(process.env.CAND || "", process.env.REF || "") > 0 ? 0 : 1);
            '
          }
          dev_installed=()
          latest_installed=()
          for pkg in $pkgs; do
            latest=$(npm view "$pkg" version)
            dev=$(npm view "$pkg@dev" version 2>/dev/null) || true
            if [ -n "$dev" ] && is_newer "$dev" "$latest"; then
              echo "Pinning $pkg to dev $dev (newer than latest $latest)"
              npm pkg set "dependencies[$pkg]=$dev"
              dev_installed+=("$pkg@$dev")
            else
              echo "Pinning $pkg to latest $latest"
              npm pkg set "dependencies[$pkg]=$latest"
              latest_installed+=("$pkg@$latest")
            fi
          done
          # Force a full, clean re-resolution instead of an incremental one: after
          # changing several package.json versions at once, `npm install` on top of
          # existing node_modules/package-lock.json can leave some packages only
          # partially installed (especially combined with self-referencing overrides
          # like "pkg": "$pkg"). Removing them first guarantees npm resolves everything
          # from the updated package.json with no stale state to confuse it.
          rm -rf node_modules package-lock.json
          npm install
          echo "dev_installed=${dev_installed[*]}" >> "$GITHUB_ENV"
          echo "latest_installed=${latest_installed[*]}" >> "$GITHUB_ENV"
      - name: Commit dependency updates
        if: steps.skip-check.outputs.should_skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add package.json package-lock.json
          msg="chore: update solidos dependencies"
          [ -n "$dev_installed" ] && msg="$msg (dev: $dev_installed)"
          [ -n "$latest_installed" ] && msg="$msg (latest: $latest_installed)"
          git commit -m "$msg"
          # Branches protected by rules (PR required / required status checks) reject
          # direct pushes with GH013. Do not fail the run in that case: the build must
          # still run, and PR runs already pin the dependencies into the merged branch.
          if ! git push; then
            echo "::warning::Dependency update not pushed to $GITHUB_REF_NAME (protected branch?) - continuing without the commit"
          fi
