name: Install SolidOS Dev Dependencies

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version
        type: number
        required: false
        default: 22

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: https://registry.npmjs.org
      - name: Install solidos dependencies (dev if newer, else latest)
        shell: bash
        run: |
          pkgs=$(node -p "(require('./package.json').solidosDependencies || []).join(' ')")
          if [ -z "$pkgs" ]; then
            echo "No solidosDependencies found, skipping"
            exit 0
          fi
          for pkg in $pkgs; do
            latest=$(npm view "$pkg" version)
            dev=$(npm view "$pkg@dev" version 2>/dev/null) || true
            if [ -n "$dev" ] && [ "$(printf '%s\n' "$latest" "$dev" | sort -V | tail -1)" = "$dev" ]; then
              echo "Pinning $pkg to dev $dev (newer than latest $latest)"
              npm pkg set "dependencies[$pkg]=$dev"
            else
              echo "Pinning $pkg to latest $latest"
              npm pkg set "dependencies[$pkg]=$latest"
            fi
          done
          # Force a full, clean re-resolution instead of an incremental one: after
          # changing several package.json versions at once, `npm install` on top of
          # existing node_modules/package-lock.json can leave some packages only
          # partially installed (especially combined with self-referencing overrides
          # like "pkg": "$pkg"). Removing them first guarantees npm resolves everything
          # from the updated package.json with no stale state to confuse it.
          rm -rf node_modules package-lock.json
          npm install
