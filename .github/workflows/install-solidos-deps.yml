name: Install SolidOS Dev Dependencies

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version
        type: number
        required: false
        default: 22

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: https://registry.npmjs.org
      - name: Install solidos dependencies (dev if newer, else latest)
        shell: bash
        run: |
          pkgs=$(node -p "(require('./package.json').solidosDependencies || []).join(' ')")
          if [ -z "$pkgs" ]; then
            echo "No solidosDependencies found, skipping"
            exit 0
          fi
          for pkg in $pkgs; do
            latest=$(npm view "$pkg" version)
            dev=$(npm view "$pkg@dev" version 2>/dev/null) || true
            if [ -n "$dev" ] && [ "$(printf '%s\n' "$latest" "$dev" | sort -V | tail -1)" = "$dev" ]; then
              echo "Pinning $pkg to dev $dev (newer than latest $latest)"
              npm pkg set "dependencies[$pkg]=$dev"
            else
              echo "Pinning $pkg to latest $latest"
              npm pkg set "dependencies[$pkg]=$latest"
            fi
          done
          # A single plain `npm install` (reconciling package.json against the lockfile)
          # uses npm's standard, well-tested install path. Using `npm install pkg@version`
          # add-specs instead (even batched into one call) hits a class of Arborist crashes
          # ("Cannot read properties of null (reading 'edgesOut'/'package')") when combined
          # with self-referencing overrides (e.g. "pkg": "$pkg").
          npm install
