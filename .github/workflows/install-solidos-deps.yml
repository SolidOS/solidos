name: Install SolidOS Dev Dependencies

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version
        type: number
        required: false
        default: 22

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm
        run: npm install -g npm@latest
      - name: Install solidos dependencies (dev if newer, else latest)
        shell: bash
        run: |
          pkgs=$(node -p "(require('./package.json').solidosDependencies || []).join(' ')")
          if [ -z "$pkgs" ]; then
            echo "No solidosDependencies found, skipping"
            exit 0
          fi
          to_install=()
          for pkg in $pkgs; do
            latest=$(npm view "$pkg" version)
            dev=$(npm view "$pkg@dev" version 2>/dev/null) || true
            if [ -n "$dev" ] && [ "$(printf '%s\n' "$latest" "$dev" | sort -V | tail -1)" = "$dev" ]; then
              echo "Will install $pkg@dev (newer than latest $latest)"
              to_install+=("$pkg@$dev")
            else
              echo "Will install $pkg@$latest"
              to_install+=("$pkg@$latest")
            fi
          done
          # Installing all packages in a single npm install call (rather than one
          # per package) avoids a known npm Arborist crash ("Cannot read properties
          # of null (reading 'edgesOut')") triggered by repeated tree mutations
          # against self-referencing overrides (e.g. "pkg": "$pkg").
          npm install "${to_install[@]}" --save-exact
